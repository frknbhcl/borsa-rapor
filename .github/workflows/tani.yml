name: Tanı (geçici)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  tani:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: veri
          key: veri-tani-${{ github.run_id }}
          restore-keys: veri-
      - run: python tani.py
      - name: Sonucu ayrı dala yaz
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir out && cp tani_cikti.txt out/ && cd out && git init -q -b tani && git add -A
          git -c user.name=rapor-botu -c user.email=rapor-botu@users.noreply.github.com commit -q -m tani
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" tani
