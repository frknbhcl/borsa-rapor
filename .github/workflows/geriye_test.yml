name: Geriye dönük test

on:
  schedule:
    - cron: "0 6 * * 6"    # her cumartesi 09:00 (TR)
  workflow_dispatch:
    inputs:
      piyasa:
        description: "Hangi piyasa?"
        type: choice
        options: [hepsi, bist, abd]
        default: hepsi

permissions:
  contents: write

concurrency:
  group: rapor            # günlük raporla aynı anda siteyi yazmasın
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Uzun geçmiş önbelleğini geri yükle
        uses: actions/cache/restore@v4
        with:
          path: veri
          key: gecmis-${{ github.run_id }}
          restore-keys: gecmis-

      - name: Önbellek yoksa kalıcı arşivden al
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p veri
          for k in bist abd; do
            if [ ! -f "veri/gecmis_$k.pkl" ]; then
              if gh release download veri-arsivi --repo "${{ github.repository }}" --pattern "gecmis_$k.pkl.gz" --dir veri --clobber; then
                gunzip -f "veri/gecmis_$k.pkl.gz" && echo "$k: arşivden alındı"
              else
                echo "$k: arşivde yok, Yahoo'dan indirilecek"
              fi
            fi
          done

      - name: Duygu verisi yoksa arşivden al (ABD)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          R: ${{ github.repository }}
        run: |
          mkdir -p veri
          for f in finra_abd kazanc_abd; do
            if [ ! -f "veri/$f.pkl" ]; then
              gh release download veri-arsivi --repo "$R" --pattern "$f.pkl.gz" --dir veri --clobber \
                && gunzip -f "veri/$f.pkl.gz" && echo "$f: arşivden alındı" || echo "$f: arşivde yok"
            fi
          done
          eksik=0; for f in finra_abd kazanc_abd; do [ -f "veri/$f.pkl" ] || eksik=1; done
          if [ "$eksik" = 1 ]; then
            mkdir -p tohum
            gh release download arastirma-verisi --repo "$R" --pattern 'yahoo_analist.pkl.gz' --pattern 'finra_aciga_satis.pkl.gz' --dir tohum --clobber || true
            python duygu.py tohum tohum veri || true
            rm -rf tohum
          fi

      - name: Geriye dönük testi çalıştır
        run: python geriye_test.py ${{ inputs.piyasa || 'hepsi' }}

      - name: Kalıcı arşive yükle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          R: ${{ github.repository }}
        run: |
          python arsiv.py veri arsiv
          gh release view veri-arsivi --repo "$R" >/dev/null 2>&1 || gh release create veri-arsivi --repo "$R" \
            --title "Fiyat geçmişi arşivi" \
            --notes "BIST ve ABD hisselerinin yaklaşık 6 yıllık günlük fiyat geçmişi. Her cumartesi geriye dönük testle güncellenir. kapanis_*.csv.gz: düzeltilmiş kapanışlar (satır = tarih, sütun = hisse); hacim_*.csv.gz: işlem adedi; gecmis_*.pkl.gz: betiklerin kullandığı önbellek. Kaynak: Yahoo Finance."
          gh release upload veri-arsivi arsiv/* --repo "$R" --clobber

      - name: Uzun geçmiş önbelleğini kaydet
        if: always()
        uses: actions/cache/save@v4
        with:
          path: veri
          key: gecmis-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Yayındaki siteyi al
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: site

      - name: Siteyi güncelle ve yayınla
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p site raporlar
          rm -rf site/.git
          cp geriye_test/*.html geriye_test/*_hafta.json site/
          python site_olustur.py raporlar site
          cd site
          git init -q -b gh-pages
          git add -A
          git -c user.name="rapor-botu" -c user.email="rapor-botu@users.noreply.github.com" \
            commit -q -m "Geriye dönük test: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" gh-pages
