name: Günlük rapor

on:
  # GitHub zamanlanmış çalıştırmaları saatlerce geciktirebiliyor ya da atlayabiliyor. Bu yüzden
  # her borsa için yedek saatler var; o günün kapanış raporu zaten yayındaysa yedek çalıştırma
  # hiçbir şey yapmadan biter.
  schedule:
    - cron: "40 15,17,19 * * 1-5"   # BIST: hafta içi 18:40, 20:40, 22:40 (TR)
    - cron: "40 21,23 * * 1-5"      # ABD: hafta içi 00:40, 02:40 (TR)
    - cron: "40 2,4 * * 2-6"        # ABD yedek: 05:40, 07:40 (TR)
  workflow_dispatch:           # GitHub uygulamasından elle çalıştırmak için
    inputs:
      piyasa:
        description: "Hangi piyasa?"
        type: choice
        options: [hepsi, bist, abd]
        default: hepsi

permissions:
  contents: write

concurrency:
  group: rapor
  cancel-in-progress: false

jobs:
  rapor:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Yayındaki raporları al
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: site

      - name: Piyasayı seç
        id: secim
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            piyasa="${{ inputs.piyasa }}"
          elif [ "${{ github.event.schedule }}" = "40 15,17,19 * * 1-5" ]; then
            piyasa=bist
          else
            piyasa=abd
          fi
          echo "piyasa=$piyasa" >> "$GITHUB_OUTPUT"
          calis=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            calis=$(python3 - "$piyasa" <<'PY'
          import sys, datetime as dt
          from pathlib import Path
          from zoneinfo import ZoneInfo
          kod = sys.argv[1]
          if kod == "bist":
              simdi = dt.datetime.now(ZoneInfo("Europe/Istanbul")); kapanis = (18, 20)
          else:
              simdi = dt.datetime.now(ZoneInfo("America/New_York")); kapanis = (16, 15)
          gun = simdi.date()
          if (simdi.hour, simdi.minute) < kapanis:
              gun -= dt.timedelta(days=1)
          while gun.weekday() >= 5:
              gun -= dt.timedelta(days=1)
          f = Path("site/raporlar") / f"{gun:%Y-%m-%d}_{kod.upper()}.html"
          kesin = f.exists() and "Piyasa henüz kapanmadı" not in f.read_text(encoding="utf-8")
          print("false" if kesin else "true")
          PY
          )
          fi
          echo "calis=$calis" >> "$GITHUB_OUTPUT"
          echo "Piyasa: $piyasa, çalıştırılacak mı: $calis"

      - uses: actions/setup-python@v5
        if: steps.secim.outputs.calis == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
        if: steps.secim.outputs.calis == 'true'

      - name: Fiyat önbelleğini geri yükle
        if: steps.secim.outputs.calis == 'true'
        uses: actions/cache/restore@v4
        with:
          path: veri
          key: veri-${{ github.run_id }}
          restore-keys: veri-

      - name: Duygu verisi yoksa arşivden al (ABD)
        if: steps.secim.outputs.calis == 'true' && steps.secim.outputs.piyasa != 'bist'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          R: ${{ github.repository }}
        run: |
          mkdir -p veri
          for f in kazanc_abd; do
            if [ ! -f "veri/$f.pkl" ]; then
              gh release download veri-arsivi --repo "$R" --pattern "$f.pkl.gz" --dir veri --clobber \
                && gunzip -f "veri/$f.pkl.gz" && echo "$f: arşivden alındı" || echo "$f: arşivde yok"
            fi
          done
          eksik=0; for f in kazanc_abd; do [ -f "veri/$f.pkl" ] || eksik=1; done
          if [ "$eksik" = 1 ]; then
            mkdir -p tohum
            gh release download arastirma-verisi --repo "$R" --pattern 'yahoo_analist.pkl.gz' --dir tohum --clobber || true
            python duygu.py tohum tohum veri || true
            rm -rf tohum
          fi

      - name: Raporu oluştur
        if: steps.secim.outputs.calis == 'true'
        run: python gunluk_rapor.py ${{ steps.secim.outputs.piyasa }} --acma

      - name: Verileri bağımsız olarak doğrula
        if: always() && steps.secim.outputs.calis == 'true'
        continue-on-error: true
        timeout-minutes: 30
        run: |
          for f in raporlar/*_tum.csv; do
            [ -e "$f" ] || continue
            kod=$(basename "$f" | sed -E 's/^[0-9-]+_([A-Z]+)_tum\.csv$/\1/' | tr 'A-Z' 'a-z')
            python dogrula.py --piyasa "$kod" --csv "$f" --cikti "${f%_tum.csv}_dogrulama.html" --json "${f%_tum.csv}_dogrulama.json" || true
          done

      - name: Fiyat önbelleğini kaydet
        if: always() && steps.secim.outputs.calis == 'true'
        uses: actions/cache/save@v4
        with:
          path: veri
          key: veri-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Siteyi hazırla
        if: steps.secim.outputs.calis == 'true'
        run: |
          mkdir -p site
          rm -rf site/.git
          python site_olustur.py raporlar site

      - name: Siteyi yayınla
        if: steps.secim.outputs.calis == 'true'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd site
          git init -q -b gh-pages
          git add -A
          git -c user.name="rapor-botu" -c user.email="rapor-botu@users.noreply.github.com" \
            commit -q -m "Rapor: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" gh-pages
