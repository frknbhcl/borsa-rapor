name: Sanal borsa fiyatları

# Sanal borsa sayfasındaki izleme listesi ve pozisyonlar için fiyatları günceller (portfoy dalına
# izleme.json yazar). Seans saatlerinde 30 dakikada bir; sayfa izleme listesine hisse ekleyince de
# elle tetiklenebilir.
on:
  schedule:
    - cron: "5,35 6-21 * * 1-5"   # 09:05–00:35 (TR), BIST ve ABD seansları
    - cron: "15 1 * * 2-6"        # ABD kapanışından sonra son güncelleme
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: izleme
  cancel-in-progress: true

jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: kod
      - uses: actions/checkout@v4
        with:
          ref: portfoy
          path: portfoy
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: kod/requirements.txt
      - run: pip install -r kod/requirements.txt
      - name: Fiyatları al
        run: python kod/izleme.py portfoy/hesap.json portfoy/izleme.json
      - name: portfoy dalına yaz
        run: |
          cd portfoy
          git config user.name "rapor-botu"
          git config user.email "rapor-botu@users.noreply.github.com"
          git add izleme.json
          git diff --cached --quiet && exit 0
          git commit -q -m "İzleme fiyatları: $(date -u +%Y-%m-%dT%H:%MZ)"
          # Sayfa aynı anda hesap.json'u güncellemiş olabilir: yeniden dene
          for i in 1 2 3 4 5; do
            git pull -q --rebase origin portfoy && git push -q origin HEAD:portfoy && exit 0
            sleep $((i * 3))
          done
          exit 1
